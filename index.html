<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión Grupo NKT</title>
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- La página pública de Grupo Nkt (/grupo/) se instala como su propia app: el manifest correcto tiene que estar desde la carga, antes de que el navegador decida qué ofrecer instalar. -->
    <script>
      (function () {
        var grupo = /^\/grupo(\/|$)/.test(location.pathname) || /[?&]grupo(&|=|$)/.test(location.search);
        document.write('<link rel="manifest" href="' + (grupo ? "/manifest-grupo.json" : "/manifest.json") + '" />');
        document.write('<meta name="apple-mobile-web-app-title" content="' + (grupo ? "Grupo Nkt" : "Gestión Grupo NKT") + '" />');
      })();
    </script>
    <meta name="theme-color" content="#C1440E" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  </head>
  <body>
    <div id="root"><div id="cargando" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0D0D0D;color:#B8B8B8;font-family:sans-serif;font-size:15px;text-align:center;padding:20px;box-sizing:border-box">Cargando…</div></div>
    <script>
      // Si la app no llega a arrancar, que se vea un mensaje con el motivo y no una pantalla vacía.
      (function () {
        var ultimo = "";
        window.addEventListener("error", function (e) { ultimo = (e && e.message) || ultimo; });
        window.addEventListener("unhandledrejection", function (e) { ultimo = String((e && e.reason && e.reason.message) || (e && e.reason) || ultimo); });
        setTimeout(function () {
          var c = document.getElementById("cargando");
          if (!c) return;
          c.style.flexDirection = "column";
          c.innerHTML = "<div style='font-size:18px;color:#F0EDE8;margin-bottom:10px'>La app no pudo cargar</div><div style='max-width:340px;line-height:1.5'>Probá recargar la página. Si sigue igual, mandá una captura de esta pantalla.</div><div style='margin-top:14px;font-size:11px;color:#777;max-width:340px;word-break:break-word'>" + (ultimo ? "Detalle: " + String(ultimo).replace(/</g, "&lt;") : "Detalle: no se descargaron los archivos de la app (puede ser la conexión o un bloqueo de la red).") + "</div>";
        }, 10000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
